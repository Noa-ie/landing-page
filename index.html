<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com/css?family=Roboto">
</head>
<body>
    <div class="hero-section">
        <div class="hero-section-container">
            <div class="header">
                <div class="logo">Header Logo</div>
                <ul class="right-links">
                    <li>header link one</li>
                    <li>header link two</li>
                    <li>header link three</li>
                </ul>
            </div>
            <div class="hero-container">
                <div class="hero-text-and-button">
                    <div class="hero-main-text">This website is awesome</div>
                    <div class="hero-secondary-text">This website has some subtext that goes here under the main title.  It's a smaller font and the color is lower contrast</div>
                    <button class="hero-button">Sign up</button>
                </div>
                <div class="hero-image">
                    <div class="image-text">this is a placeholder for an image</div>
                </div>
            </div>
        </div>
    </div>
    <div class="info-section">
        <div class="info-title"></div>
        <div class="info-container">
            <div class="info">
                <div class="info-image"></div>
                <div class="info-text"></div>
            </div>
            <div class="info">
                <div class="info-image"></div>
                <div class="info-text"></div>
            </div>
            <div class="info">
                <div class="info-image"></div>
                <div class="info-text"></div>
            </div>
            <div class="info">
                <div class="info-image"></div>
                <div class="info-text"></div>
            </div>
        </div>
    </div>
    <div class="quote-section">
        <div class="quote-container">
            <div class="quote"></div>
            <div class="author"></div>
        </div>
    </div>
    <div class="cta-section">
        <div class="cta-container">
            <div class="cta-text">
                <div class="cta-main-text"></div>
                <div class="cta-secondary-text"></div>
            </div>
            <button class="cta-button"></button>
        </div>
    </div>
    <div class="footer"></div>
</body>
</html>
